name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BlazorWorkbench.slnx

      - name: Build
        run: dotnet build BlazorWorkbench.slnx --no-restore -c Debug

      - name: Install Playwright browser
        run: dotnet run --project src/BlazorWorkbench.Cli --no-build -- install-browsers ${{ runner.os == 'Linux' && '--with-deps' || '' }}

      - name: Unit, component and end-to-end tests
        run: dotnet test BlazorWorkbench.slnx --no-build --logger "trx;LogFilePrefix=tests" --results-directory artifacts/test-results

      - name: Validate sample scenarios
        run: dotnet run --project src/BlazorWorkbench.Cli --no-build -- validate --no-build --warnings-as-errors

      - name: Workbench tests (render, interactions, accessibility)
        run: dotnet run --project src/BlazorWorkbench.Cli --no-build -- test --no-build --a11y --retries 1 -o artifacts/workbench

      - name: Dependency vulnerability check
        shell: bash
        run: |
          dotnet list BlazorWorkbench.slnx package --vulnerable --include-transitive | tee artifacts/vulnerabilities.txt
          ! grep -q "has the following vulnerable packages" artifacts/vulnerabilities.txt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: |
            artifacts/workbench
            artifacts/test-results
            artifacts/e2e
          retention-days: 14

  visual:
    # Visual baselines are platform specific (docs/adr/0007-platform-baselines.md). The committed baselines were captured on
    # Windows. Until baselines for this runner image are approved from the uploaded report, this job reports missing or
    # changed screenshots without blocking the pipeline.
    name: Visual regression (windows)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build BlazorWorkbench.slnx -c Debug
      - run: dotnet run --project src/BlazorWorkbench.Cli --no-build -- install-browsers
      - run: dotnet run --project src/BlazorWorkbench.Cli --no-build -- test --no-build --visual --no-interactions -o artifacts/visual
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: artifacts/visual
          retention-days: 14

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet pack BlazorWorkbench.slnx -c Release -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
