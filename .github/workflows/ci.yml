name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # CI builds the MAUI library for Windows only; the pack job builds every platform.
  MAUI_WINDOWS: net10.0-windows10.0.19041.0

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds everything except the .NET MAUI projects (BlazorWorkbench.Web.slnf).
          - os: ubuntu-latest
            solution: BlazorWorkbench.Web.slnf
          - os: windows-latest
            solution: BlazorWorkbench.slnx
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # --changed-since needs history

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install the .NET MAUI workload
        if: runner.os == 'Windows'
        run: dotnet workload install maui-windows

      - name: Restore
        run: dotnet restore ${{ matrix.solution }} -p:WorkbenchMauiTargets=${{ env.MAUI_WINDOWS }}

      - name: Build
        run: dotnet build ${{ matrix.solution }} --no-restore -c Debug -p:WorkbenchMauiTargets=${{ env.MAUI_WINDOWS }}

      - name: Install Playwright browser
        run: dotnet run --project src/BlazorWorkbench.Cli --no-build -- install-browsers ${{ runner.os == 'Linux' && '--with-deps' || '' }}

      - name: Unit, component and end-to-end tests
        run: dotnet test ${{ matrix.solution }} --no-build --logger "trx;LogFilePrefix=tests" --results-directory artifacts/test-results

      - name: Validate sample scenarios
        run: dotnet run --project src/BlazorWorkbench.Cli --no-build -- validate --no-build --warnings-as-errors

      - name: Workbench tests, Interactive Server (render, interactions, accessibility)
        run: dotnet run --project src/BlazorWorkbench.Cli --no-build -- test --no-build --a11y --retries 1 -o artifacts/workbench

      - name: Workbench tests, Interactive WebAssembly
        run: dotnet run --project src/BlazorWorkbench.Cli --no-build -- test --no-build --a11y --retries 1 -p samples/SampleWorkbench.Wasm/SampleWorkbench.Wasm.csproj -o artifacts/workbench-wasm

      - name: Workbench tests, .NET MAUI Blazor Hybrid (WebView2)
        if: runner.os == 'Windows'
        run: dotnet run --project src/BlazorWorkbench.Cli --no-build -- test --no-build --a11y --retries 1 -p samples/SampleWorkbench.Maui/SampleWorkbench.Maui.csproj -o artifacts/workbench-hybrid

      - name: Dependency vulnerability check
        shell: bash
        run: |
          dotnet list ${{ matrix.solution }} package --vulnerable --include-transitive | tee artifacts/vulnerabilities.txt
          ! grep -q "has the following vulnerable packages" artifacts/vulnerabilities.txt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: |
            artifacts/workbench
            artifacts/workbench-wasm
            artifacts/workbench-hybrid
            artifacts/test-results
            artifacts/e2e
          retention-days: 14

  visual-windows:
    # Baselines in samples/SampleWorkbench/baselines/windows* are captured on Windows with the pinned Playwright Chromium.
    name: Visual regression (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-windows
      - run: dotnet build BlazorWorkbench.slnx -c Debug -p:WorkbenchMauiTargets=${{ env.MAUI_WINDOWS }}
      - run: dotnet run --project src/BlazorWorkbench.Cli --no-build -- install-browsers
      - name: Server
        run: dotnet run --project src/BlazorWorkbench.Cli --no-build -- test --no-build --visual --no-interactions -o artifacts/visual-windows-server
      - name: WebAssembly
        run: dotnet run --project src/BlazorWorkbench.Cli --no-build -- test --no-build --visual --no-interactions -p samples/SampleWorkbench.Wasm/SampleWorkbench.Wasm.csproj -o artifacts/visual-windows-webassembly
      - name: Blazor Hybrid (informational)
        # windows-hybrid baselines depend on the WebView2 runtime, which updates itself (Evergreen) and may differ on
        # the runner. The step reports differences without failing the job; see docs/hybrid.md#visual-baselines.
        continue-on-error: true
        run: dotnet run --project src/BlazorWorkbench.Cli --no-build -- test --no-build --visual --no-interactions -p samples/SampleWorkbench.Maui/SampleWorkbench.Maui.csproj -o artifacts/visual-windows-hybrid
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-windows
          path: artifacts/visual-windows-*
          retention-days: 14

  visual-linux:
    # Runs in a pinned container image so Linux baselines can be reproduced locally (eng/visual-linux.sh).
    name: Visual regression (linux container)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Visual suite (Server and WebAssembly)
        run: SRC="$GITHUB_WORKSPACE" bash eng/visual-linux.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-linux
          path: artifacts/visual-linux-*
          retention-days: 14

  template:
    name: Template smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack
        run: dotnet pack BlazorWorkbench.Web.slnf -c Release -o artifacts/packages
      - name: Create, build and test a host from the template
        shell: bash
        run: |
          mkdir -p /tmp/template && cd /tmp/template
          cat > nuget.config <<EOF
          <configuration><packageSources><clear />
            <add key="workbench-packages" value="$GITHUB_WORKSPACE/artifacts/packages" />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
          </packageSources></configuration>
          EOF
          cp "$GITHUB_WORKSPACE/global.json" .
          dotnet new install "$GITHUB_WORKSPACE/artifacts/packages/BlazorWorkbench.Templates.0.1.0.nupkg"
          dotnet new blazorworkbench -n Acme.Workbench
          cd Acme.Workbench
          dotnet build
          dotnet tool install --tool-path ../tools BlazorWorkbench.Cli --version 0.1.0 --add-source "$GITHUB_WORKSPACE/artifacts/packages"
          ../tools/workbench install-browsers --with-deps
          ../tools/workbench test --no-build --a11y

  pack:
    # Windows: BlazorWorkbench.Maui targets Android, iOS, Mac Catalyst and Windows.
    name: Pack
    runs-on: windows-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui
      - run: dotnet pack BlazorWorkbench.slnx -c Release -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
